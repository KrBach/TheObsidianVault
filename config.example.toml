# Copy this file to config.toml and edit it. config.toml is git-ignored.

[names]
# Who is who. The code never names a real person; these go into the game's text and what the
# companion is told. Your companion's identity itself (voice, character) lives in soul.md.
owner = "Your name"
companion = "Tally"
# Your portrait in the talk box and on the login card: an image under web/, e.g. "portraits/me.jpg".
# Leave empty for a painted stand-in.
owner_portrait = ""

[tally]
# Folder that holds Tally's shared core (bootstrap.md, soul.md).
# This is read, never written. Your private notes stay out of the repo.
core_dir = "~/path/to/obsidian/Private"

# Time zone for log timestamps (an IANA name such as "Europe/Berlin"). Empty = this computer's.
timezone = ""

# Core files, loaded in this order from core_dir.
core_files = ["bootstrap.md", "soul.md"]

# The Work vault (optional). Tally may read it for work tasks (INDEX.md first), never write it,
# and never copy work content into the Private vault. Leave empty to keep work out of the game.
work_dir = ""

# Context layer for this use case, layered on top of the core.
# Lives in the repo because it describes the game, not Tally.
context_file = "context/the-vault-game.md"

# Every few minutes while the game is open, Tally is asked whether to go somewhere or say
# something. Each tick is one small call (no tools, no history, a short sketch of Tally):
# about 4,000 tokens in and 50 out, under a tenth of a cent on Haiku. 0 turns it off.
# Ticks pause while the tab is hidden and after 30 minutes without input from you.
tick_minutes = 6
tick_model = "haiku"

[brain]
# "claude-code" (default): runs `claude -p` with your Claude Code login. No API key, no packages.
# "api": calls the Claude API with ANTHROPIC_API_KEY (needs: python3 -m pip install -r requirements.txt).
kind = "claude-code"

# Only needed if the game says it cannot find Claude Code: paste the output of `which claude`.
claude_path = ""

# Leave empty to use your Claude Code default model.
model = ""

# Tools Tally may use in claude-code mode. Read-only: Tally can look at notes but not edit them.
# Writing goes only through the vault tools below, never through Edit or Write.
tools = ["Read", "Glob", "Grep"]

# Let Tally look things up on the web (WebSearch, WebFetch), as the core's "look things up live"
# rule asks. Read-only. false turns it off.
web = true

[writes]
# How Tally may write to the vault (Claude Code brain only):
#   "off"     nothing is written
#   "review"  note edits and new notes wait for your approval in the game (the ledger panel);
#             soul.md changes go in at once unless soul_direct = false
#   "direct"  the same, and soul.md changes go in at once whatever soul_direct says
mode = "review"

# soul.md is Tally's own: its log lines, coaching items and edits go in at once, with a backup.
# false = those wait for your review too.
soul_direct = true

# Theme folders where Tally may propose note edits and new notes.
# bootstrap.md, archive/, templates/ and hidden folders are never written.
folders = ["games", "worldbuilding", "ai-risk", "obsidian", "experiments"]

# Pending changes, backups and the write journal (git-ignored).
state_dir = ".vault-state"

[server]
host = "127.0.0.1"
port = 8765

[errands]
# Bigger jobs Tally writes out and sets on the desk. Nothing runs until you approve one in the ledger;
# then a separate Claude Code session does it and Tally hears the report. Kinds:
#   research  reads the vaults and the web, writes nothing
#   code      changes the game in its own git worktree and branch (errand/<id>), runs the tests,
#             commits and pushes that branch only; never main, never a merge
#   session   your full Claude Code setup (skills, connectors, browser) in the vault folder, e.g. a
#             regular data check; tools that spend art credits are blocked unless the errand
#             carries a spending limit you approved
enabled = true
timeout_minutes = 45
max_running = 2
# Leave empty for your Claude Code default model.
model = ""
# Where code errands put their worktrees (default: next to this repo).
# worktrees = "~/TheObsidianVault-errands"
# Tools a session errand may use without asking. Names of your connectors' tools in Claude Code
# start with mcp__<server>__; a bare mcp__<server> allows all of that server's tools.
session_tools = ["Read", "Glob", "Grep", "Edit", "Write", "Bash", "Skill", "WebSearch", "WebFetch", "mcp__claude-in-chrome"]

[board]
# Vault folders the notice board shows (read-only): notes, images and HTML pages.
# Errand reports and links Tally pins are always there.
folders = ["Claude outputs"]
