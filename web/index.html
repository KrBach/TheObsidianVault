<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Obsidian Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <header>
      <span class="title">THE OBSIDIAN VAULT</span>
      <span id="status" class="dim"></span>
    </header>

    <main>
      <section id="view">
        <canvas id="map"></canvas>
        <div id="hover"></div>
      </section>

      <aside id="side">
        <div class="panel">
          <div class="label">LOCATION</div>
          <div id="room-name" class="room"></div>
          <div id="room-desc" class="dim"></div>
        </div>
        <div class="panel">
          <div class="label">NEARBY</div>
          <div id="nearby"></div>
        </div>
        <div class="panel keys">
          <div class="label">KEYS</div>
          <div><b>click</b> to walk, click Tally to talk</div>
          <div><b>arrows</b> / <b>wasd</b> / <b>hjkl</b> step</div>
          <div><b>t</b> talk when next to Tally</div>
          <div><b>v</b> view: <span id="view-name"></span>, <b>wheel</b> zoom</div>
          <div><b>esc</b> stop talking</div>
          <div><b>n</b> new conversation</div>
        </div>
      </aside>
    </main>

    <section id="bottom">
      <div id="dialogue">
        <figure class="portrait" id="portrait-tally"><div class="art"></div><figcaption class="name"></figcaption></figure>
        <div id="log"></div>
        <figure class="portrait" id="portrait-player"><div class="art"></div><figcaption class="name"></figcaption></figure>
      </div>
      <form id="talk" hidden>
        <span class="prompt">Kristian&gt;</span>
        <input id="say" autocomplete="off" spellcheck="true" placeholder="Say something to Tally (Esc to step away)">
      </form>
    </section>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
